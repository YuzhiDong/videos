<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>科普视频合集</title><style>
body{margin:0;font-family:-apple-system,"PingFang SC","Noto Sans SC",sans-serif;background:linear-gradient(#fff4e6,#ffe3ec);color:#5a3d2b;min-height:100vh}
header{text-align:center;padding:28px 16px 8px}h1{margin:0;font-size:30px}header p{color:#8a6a55;margin:6px 0 0}
a.back{display:inline-block;margin-top:10px;color:#a07860;text-decoration:none}
main{max-width:980px;margin:0 auto;padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
.card{background:#fff;border-radius:22px;box-shadow:0 6px 18px #f0a0a040;overflow:hidden}
.player{position:relative;aspect-ratio:16/9;background:#fdeee0;cursor:pointer}
.player img{width:100%;height:100%;object-fit:cover;display:block}.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:50%;background:#ff8a8acc;color:#fff;font-size:28px;display:grid;place-items:center;box-shadow:0 4px 0 #d96a6a}
.dur{position:absolute;right:8px;bottom:8px;background:#5a3d2bcc;color:#fff;font-size:12px;padding:2px 8px;border-radius:10px}
.soon{position:absolute;left:8px;top:8px;background:#fff;color:#a07860;font-size:12px;padding:2px 8px;border-radius:10px}
.body{padding:12px 16px 16px}h2{font-size:18px;margin:0 0 6px}.body p{margin:0;color:#8a6a55;font-size:14px;line-height:1.5}
footer{text-align:center;color:#a07860;font-size:12px;padding:20px}</style></head><body>
<header><h1>🎬 科普视频合集</h1><p>动画讲解小视频，点一下就能看</p></header>
<main id="list"></main><footer>视频托管在 YouTube（不公开），仅供家人观看</footer>
<script>
const VIDEOS=[{"id": "agent-collab-explainer", "title": "多个 AI 助手怎么一起干活？", "description": "用工程蓝图的方式，看几个 AI 助手怎样分工、交接、检查，一起把一个小游戏做出来。", "site_thumb": "thumbs/agent-collab-explainer.jpg", "duration_mmss": "2:55", "youtube_id": "Tv0YCfclZME"}, {"id": "vector-db-explainer", "title": "向量数据库：在星空里找相似", "description": "把文字变成星空里的点，看看电脑怎样很快找到意思最接近的那颗星。", "site_thumb": "thumbs/vector-db-explainer.jpg", "duration_mmss": "1:44", "youtube_id": "ULuUV9xTFX4"}, {"id": "github-explainer", "title": "GitHub 是什么？", "description": "一起认识程序员存放和合作写代码的地方：仓库、提交、分支和合并。", "site_thumb": "thumbs/github-explainer.jpg", "duration_mmss": "1:28", "youtube_id": "BWeN_rlhEp8"}, {"id": "beijing-travel", "title": "北京旅游攻略", "description": "盖着护照印章去北京：故宫、天安门、国家博物馆和八达岭长城，出发前要知道的小规则。", "site_thumb": "thumbs/beijing-travel.jpg", "duration_mmss": "1:39", "youtube_id": "KpgipLSyy1s"}, {"id": "grok-bot-explainer", "title": "认识 Grok Bot 小助手", "description": "一个会帮忙做游戏、查资料、做视频的 AI 小助手是怎样工作的。", "site_thumb": "thumbs/grok-bot-explainer.jpg", "duration_mmss": "1:18", "youtube_id": "ALdRUT-HgKI"}];
const list=document.getElementById('list');
for(const v of VIDEOS){const c=document.createElement('div');c.className='card';
c.innerHTML=`<div class="player"><img loading="lazy" src="${v.site_thumb}" alt=""><div class="play">▶</div><span class="dur">${v.duration_mmss}</span>${v.youtube_id?'':'<span class="soon">即将上线</span>'}</div><div class="body"><h2></h2><p></p></div>`;
c.querySelector('h2').textContent=v.title;c.querySelector('p').textContent=v.description;
const p=c.querySelector('.player');p.onclick=()=>{if(!v.youtube_id)return;p.innerHTML=`<iframe src="https://www.youtube.com/embed/${v.youtube_id}?autoplay=1&rel=0&playsinline=1&origin=${encodeURIComponent(location.origin)}" referrerpolicy="strict-origin-when-cross-origin" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen loading="lazy" title=""></iframe>`;};
list.appendChild(c);}
</script></body></html>
